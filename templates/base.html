<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <!-- Makes the website responive to different screen sizes -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- The Website page title -->
        <title>
            {% if title %}
                {{ title }} | NetLux
            {% else %}
                NetLux
            {% endif %}
        </title>

        <!-- The Main stylesheet -->
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

        <!-- Website Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fleur+De+Leah&display=swap" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    </head>


    <body>

        <!-- Hidden theme controls to change the website's theme -->
        <input type="checkbox" id="theme-toggle" class="theme-toggle">

        <!-- Holds the entire page's layout -->
        <div class="wrapper">

            <!-- Only show the navibation bar after the user logs in -->
            {% if session.get('logged_in') %}

            <!-- Main navigation bar -->
            <header class="navbar">

                <!-- Website logo that links back to all movies -->
                <a href="/" class="logo">NetLux</a>

                <!-- Main navigation links -->
                <nav class="navbar-links">

                    <!-- Display every movie -->
                    <a href="/" class="navbar-btn">Home</a>

                    <!-- Display watchlisted movies -->
                    <a href="/?status=watchlist" class="navbar-btn">Watchlist</a>

                    <!-- Display watched movies -->
                    <a href="/?status=watched" class="navbar-btn">Watched</a>
                </nav>

                <!-- Search bar and setting menu -->
                <div class="right-navbar">

                    <!-- Search by avaible columns -->
                    <div class="search-box">
                        <form method="GET" action="/">

                            <!-- Search text -->
                            <input type="text" name="search" placeholder="Search" value="{{ request.args.get('search', '') }}">

                            <!-- Keep status while searching -->
                            {% if request.args.get('status') %}
                            <input type="hidden" name="status" value="{{ request.args.get('status') }}">
                            {% endif %}

                            <!-- Submit Search -->
                            <button type="submit" value="Search">Submit</button>
                        </form>
                    </div>

                    <!-- Setting menu - theme and logout -->
                    <div class="settings">

                        <!-- Opens and closes the setting menu -->
                        <button type="button" onclick="toggleSettings()" class="action-btn">⚙️</button>

                        <!-- Hidden setting options -->
                        <div id="settings-options" class="settings-options hidden">

                            <!-- Changes theme of website -->
                            <label for="theme-toggle" class="theme-option">Change Theme</label>

                            <!-- Log off option that logs the user out of their account -->
                            <a href="{{ url_for('logout') }}" class="logout">Logout</a>

                        </div>
                    </div>
                </div>
            </header>

            {% endif %}

            <!--Page specific content-->
            <main>
                {% block main %}{% endblock %}
            </main>

            <!-- Only shows footer when logged in -->
            {% if session.get('logged_in') %}
            
            <!--Website footer-->
            <footer>
                <p>@Thanakshaya Sathasivam 2026</p>
            </footer>

            {% endif %}

        </div>

        <script>
            // Opens or closes the settings dropdown menu
            function toggleSettings() {

                // Find the setting menu
                var menu = document.getElementById("settings-options");
                
                // Only change the menu if option exists
                if (menu) {

                    // Add or remove the hidden class
                    menu.classList.toggle("hidden");
                }
            }


            // Find the hidden theme button
            var themeToggle = document.getElementById("theme-toggle");

            // Only continue if the button exists
            if (themeToggle) {

                // Return the user's saved theme
                if (localStorage.getItem("theme") === "dark") {
                    themeToggle.checked = true;
                }

                // Runs whenever the user changes theme
                themeToggle.addEventListener("change", function() {

                    // Save dark theme
                    if (themeToggle.checked) {
                        localStorage.setItem("theme", "dark");
                    } 
                    
                    // Save pink theme
                    else {
                        localStorage.setItem("theme", "light");
                    }
                });
            }

            // Track clicks anywhere on website page 
            document.addEventListener("click", function(event) {

                // Find settings container
                var settings = document.querySelector(".settings");
                
                // Find settings menu
                var menu = document.getElementById("settings-options");

                // Close menu when clicking outside settings
                if (settings && menu && !settings.contains(event.target)) {
                    menu.classList.add("hidden");
                }
            });
            
        </script>

    </body>
</html>
