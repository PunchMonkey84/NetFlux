{% extends "base.html" %}

{% block main %}

<!-- Login form container -->
<div class="login-container">

    <div class="login-box">

        <!-- Website name -->
        <h1 class="logo-title">NetLux</h1>
        
        <!-- Login page heading -->
        <h2>Login</h2>

        <!-- Displays Error message if details are incorrect -->
        {% if error %}
            <p class="error-msg">{{ error }}</p>
        {% endif %}

        <!-- Send details to the Flask login route -->
        <form action="/login" method="POST">

            <!-- Email input -->
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required placeholder="Enter email">
            </div>

            <!-- Password input -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter password">
            </div>

            <!-- Optional user feedback -->
            <div class="form-group">
                <label for="feedback">Leave Feedback</label>
                <textarea id="feedback" name="feedback" rows="3" placeholder="Optional feedback..."></textarea>
            </div>

            <!-- Submits the login details -->
            <button type="submit" class="submit-btn">Submit</button>
            
        </form>
    </div>
</div>

{% endblock %}
